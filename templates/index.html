<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rordog AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div class="header-avatar">🤖</div>
    <div class="header-info">
        <h1>Rordog AI</h1>
        <div class="status">Online</div>
    </div>
    <div class="header-spacer"></div>
    <div class="header-user" id="header-user">
        <button class="sign-in-btn" id="open-auth-btn">Sign In</button>
    </div>
</header>

<main>
    <div class="chat-container">
        <div class="chat-window" id="chat-window">
            <div class="message ai-message">
                <div class="bubble-wrap ai-wrap">
                    <div class="avatar ai-avatar">🤖</div>
                    <div class="bubble ai-bubble">
                        <p>Hey! I'm Rordog AI. Ask me anything, or use the <strong>+</strong> button to share a photo or file!</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="attachment-preview" id="attachment-preview">
                📎 <span id="attachment-name"></span>
                <button class="remove-btn" id="remove-attachment" title="Remove">✕</button>
            </div>
            <div class="input-row">
                <div class="plus-wrap">
                    <button class="plus-btn" id="plus-btn" title="Attach">+</button>
                    <div class="plus-menu" id="plus-menu">
                        <button id="menu-photo">📷 Photo</button>
                        <button id="menu-file">📄 File</button>
                    </div>
                </div>
                <input type="text" class="chat-input" id="user-input" placeholder="Message Rordog AI..." autocomplete="off">
                <button class="send-btn" id="send-btn" title="Send">↑</button>
            </div>
        </div>
    </div>
</main>

<footer>Rordog AI &mdash; Created by Rordog</footer>

<!-- Hidden file inputs -->
<input type="file" id="photo-input" accept="image/*" style="display:none">
<input type="file" id="file-input" accept=".pdf,.txt,.csv,.md,.py,.js,.html,.css,.json" style="display:none">

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal-box">
        <button class="modal-close" id="modal-close">✕</button>
        <h2 class="modal-title">Welcome to Rordog AI</h2>
        <div class="modal-tabs">
            <button class="tab-btn active" id="tab-signin">Sign In</button>
            <button class="tab-btn" id="tab-signup">Create Account</button>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="auth-username" class="auth-input" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" class="auth-input" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button class="auth-submit" id="auth-submit">Sign In</button>
        <button class="auth-guest" id="auth-guest">Continue without an account</button>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
